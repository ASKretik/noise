# Deploy NOISE to GitHub Pages.
#
# There is no build step: the game is plain ES modules and Pages serves them as they are.
# This workflow uploads the repository root as the site, so index.html, /sim, /web and
# /bots are served at the paths index.html already references, and nothing is duplicated.
#
# ONE-TIME SETUP, in the repository on github.com:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
# Then push to main. The URL appears in the workflow summary and under Settings > Pages,
# and is https://<your-username>.github.io/<repo-name>/
#
# The tests run before the deploy on purpose: a broken game should not replace a
# working one just because it was pushed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Acceptance criteria
        # Default seed count (14). At 8 the per-bot accuracy margins are noisy
        # enough that criteria 5 and 6 flip on seed choice alone.
        run: npm test
      - name: Web layer smoke test
        run: npm run webcheck
      - name: 3D acceptance criteria
        # The 2D suites just ran above, so 3D-1 is not repeated here.
        run: npm run test3d -- --skip-2d

  # Packaging and deploying are separate jobs (GitHub's own layout for Pages). Until
  # 2026-11-25 they were one job, and deploy-pages asked for the artifact about 0.3 s after
  # upload-pages-artifact had finalised it; three pushes in a row it was not listed yet
  # ("No artifacts named github-pages were found") and the site stayed a build behind.
  # A job boundary gives the artifact time to appear; a second attempt 30 s later covers
  # the rest.
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload the repository root as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy, second attempt
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
