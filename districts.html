<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOISE — districts</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0906'/><circle cx='50' cy='46' r='26' fill='%23ff4d5e'/><circle cx='40' cy='42' r='6' fill='%23ffe9ec'/><circle cx='60' cy='42' r='6' fill='%23ffe9ec'/></svg>">
<link rel="stylesheet" href="web/style.css?v=17">
</head>
<body class="hub-body">

<header class="hubbar">
  <a class="logo small" href="index.html" title="Back to profiles">NOISE</a>
  <span class="chip">subject <b id="hub-profile">—</b></span>
  <span class="chip">tier <b id="hub-difficulty">—</b></span>
  <span class="spacer"></span>
  <span class="wallet" id="wallet"><i class="coin-pip"></i><b id="wallet-coins">0</b> coins</span>
  <nav class="tabs">
    <button class="tab" id="tab-districts" data-tab="districts">districts</button>
    <button class="tab" id="tab-shop" data-tab="shop">shop</button>
  </nav>
  <a class="btn ghost" href="index.html">switch profile</a>
</header>

<main class="hub">
  <section id="panel-districts" class="hub-panel">
    <p class="hub-note" id="districts-note"></p>
    <div class="district-grid" id="district-grid"></div>
  </section>

  <section id="panel-shop" class="hub-panel" hidden>
    <p class="hub-note">
      Coins come from what you pick up in a district, a flat bonus for clearing it, and a
      share of your score. Replaying a district still pays coins — the score is what decays.
    </p>
    <div class="shop-grid" id="shop-grid"></div>
    <p class="hub-note muted" id="shop-status"></p>
  </section>
</main>

<script type="module" src="web/districts.js"></script>
</body>
</html>
